<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38271E" />
      <stop offset="100%" stop-color="#211E1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE5" />
      <stop offset="50%" stop-color="#C29F68" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#C29F68" stroke-width="3" opacity="0.4" />
  
  <!-- Central Emblem Box -->
  <rect x="116" y="116" width="280" height="280" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Monogram WG -->
  <text x="256" y="295" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="140" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">WG</text>
  
  <!-- Subtitle -->
  <text x="256" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#E4D5BD" text-anchor="middle" letter-spacing="8">WONDER GRAND</text>
</svg>
